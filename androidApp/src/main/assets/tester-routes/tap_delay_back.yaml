schema_version: 2
id: fixture.tap_delay_back
version: 1.0.0
platform: android
app_id: com.vlad.mcpserver.fixture
timeout_ms: 15000
parameters:
  pause_ms: {type: integer, default: 300}
setup:
  - device_state: {keep_awake: true}
  - open_link: {uri: "tester-fixture://route/cards"}
  - wait: {condition: idle, timeout_ms: 3000}
steps:
  - tap: {resource_id: show_compose}
  - delay: {milliseconds: "${pause_ms}"}
  - back: {}
postconditions:
  - wait: {condition: visible, text: "Synthetic cards fixture", text_exact: true, timeout_ms: 3000}
  - assert: {condition: text, resource_id: action_count, expected: "0"}
cleanup:
  - wait: {condition: idle, timeout_ms: 3000}
